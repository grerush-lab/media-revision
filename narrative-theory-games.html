<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narrative Theory Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: screening-room look shared with the poster game. Tabs pick the theory; image tickets on one side, the theory's slots on the other. */
:root{
  --bg:#141218; --panel:#1e1b23; --panel2:#27232d; --line:#3a3442; --fg:#f1ece4; --muted:#a79fb0;
  --marquee:#f2c14e; --ticket:#efe4cf; --ticket-ink:#2a2118;
  --ok:#5fcf8a; --no:#ff6b5e; --ok-bg:rgba(95,207,138,.14);
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marquee)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5vw,3.4rem);line-height:.95;margin:4px 0 6px;letter-spacing:.02em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:66ch}
.lede b{color:var(--fg)}
.toggle{font-family:var(--mono);font-size:.76rem;display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--marquee);width:16px;height:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.tab{font:inherit;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.tab small{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tab span{font-family:var(--display);font-size:1.3rem;letter-spacing:.03em;line-height:1.05}
.tab em{font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--marquee);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--marquee);color:var(--ticket-ink);border-color:var(--marquee)}
.tab[aria-selected="true"] small,.tab[aria-selected="true"] em{color:var(--ticket-ink)}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.gamehead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;margin:18px 0 6px}
.gamehead h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.03em;line-height:1}
.gamehead h2 small{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.gamehead p{margin:4px 0 0;color:var(--muted);max-width:70ch;font-size:.92rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{color:var(--marquee)}
.btn{font:inherit;font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;background:var(--marquee);color:var(--ticket-ink);border:0;border-radius:4px;padding:8px 13px;cursor:pointer}
.btn.ghost-btn{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.game{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:24px;margin-top:14px;align-items:start}
.game.wide-cards{grid-template-columns:minmax(0,1fr)}
.tray{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto;padding:2px 6px 8px 2px}
.wide-cards .tray{position:static;max-height:none;overflow:visible;flex-direction:row;flex-wrap:wrap}
.tray-head{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.done-msg{font-size:.88rem;color:var(--muted);font-style:italic;margin:0}
/* image cards */
.card{position:relative;text-align:left;font:inherit;color:var(--ticket-ink);background:var(--ticket);border:0;border-radius:6px;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.35);flex:none}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;pointer-events:none;background:#000}
.card .txt{padding:8px 12px 10px;display:flex;flex-direction:column;gap:2px}
.card .nm{font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;line-height:1}
.card .clue{font-size:.82rem;line-height:1.35;color:#4b3f31}
.card .badge{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--marquee);color:var(--ticket-ink);border-radius:3px;padding:3px 7px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card.noimg .txt{padding:12px 14px}
.card.knit{background-color:#f2c9dc;background-image:repeating-linear-gradient(60deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px),repeating-linear-gradient(-60deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.card.knit .clue{color:#4a2a3a}
/* chips (text tickets) */
.card.chip{border-radius:4px;padding:9px 16px;box-shadow:none;
  -webkit-mask:radial-gradient(circle 5px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 5px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.card.chip{flex:0 1 auto;max-width:100%}
.card.chip .nm{font-family:var(--mono);font-weight:600;font-size:.86rem;letter-spacing:0}
.card:focus-visible{outline:3px solid var(--marquee);outline-offset:3px}
.card.sel{box-shadow:0 0 0 3px var(--marquee),0 6px 18px rgba(0,0,0,.4);transform:translateY(-2px)}
.card.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.94;box-shadow:0 12px 28px rgba(0,0,0,.6);transform:rotate(-2deg);margin:0}
.card.dragging{opacity:.25}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* zones */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.board.stages{grid-template-columns:repeat(5,minmax(0,1fr))}
.board.pics{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.zone{min-width:0;background:var(--panel);border:2px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:140px;transition:border-color .15s,background .15s;position:relative}
.zone h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.55rem;letter-spacing:.04em;line-height:1;color:var(--marquee)}
.zone .step{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.zone .def{margin:0;font-size:.84rem;color:var(--muted);line-height:1.4}
.hide-defs .zone .def{display:none}
.zone .zimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;pointer-events:none}
.zone.over{border-color:var(--marquee);border-style:solid;background:var(--panel2)}
.zone.target{border-color:rgba(242,193,78,.65)}
.zone.has{border-style:solid;border-color:var(--ok)}
.placedlist{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.placed{display:flex;gap:8px;align-items:flex-start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:5px;padding:6px;animation:stamp .35s ease-out}
.placed img{width:84px;height:60px;object-fit:cover;border-radius:3px;flex:none}
.placed b{font-family:var(--display);font-weight:400;font-size:1.1rem;letter-spacing:.03em;color:var(--ok);display:block;line-height:1.1}
.placed span{font-size:.8rem;color:var(--fg);line-height:1.35;display:block}
.placed div{min-width:0}
@keyframes stamp{0%{transform:scale(1.25) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.zone .stampmark{position:absolute;top:-13px;right:8px;background:var(--bg);font-family:var(--display);font-size:1.2rem;letter-spacing:.08em;color:var(--ok);border:2px solid var(--ok);border-radius:4px;padding:0 6px;transform:rotate(8deg);animation:stamp .35s ease-out}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:min(580px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:10px 14px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--no)}
.toast b{display:block;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.toast.bad b{color:var(--no)}.toast:not(.bad) b{color:var(--ok)}
.finish{margin-top:22px;border:1px solid var(--marquee);border-radius:8px;padding:18px 20px;background:var(--panel)}
.finish h3{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;color:var(--marquee);letter-spacing:.03em}
.finish .big{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.finish p{margin:.5rem 0;max-width:72ch}
.finish ul{margin:.4rem 0;padding-left:1.2rem;max-width:72ch}.finish li{margin:.3rem 0}
.finish .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lede-img{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.lede-img img{height:120px;width:auto;border-radius:5px;border:1px solid var(--line)}
@media (max-width:980px){.board.stages{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
@media (max-width:820px){
  .game{grid-template-columns:minmax(0,1fr)}
  .tray{position:static;max-height:none;overflow:visible;flex-direction:row;flex-wrap:wrap}
  .tray .card:not(.chip){width:calc(50% - 5px)}
  .card .nm{font-size:1.15rem}.card .clue{font-size:.76rem}
}
@media (min-width:821px){.wide-cards .tray .card:not(.chip){width:220px}}
@media (prefers-reduced-motion:reduce){.card.shake,.placed,.zone .stampmark{animation:none}.zone{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">GCSE Media · Media language · Narrative theory</div>
      <h1>Narrative Theory Games</h1>
      <p class="lede">Three games, one for each theorist on your sheet: <b>Todorov</b>, <b>Propp</b> and <b>Lévi-Strauss</b>. Drag a ticket onto the right slot, or tap a ticket then tap the slot.</p>
    </div>
    <label class="toggle" for="hard"><input type="checkbox" id="hard"> Hide definitions (harder)</label>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Games"></nav>
  <main id="game"></main>
</div>
<div class="toast" id="toast" hidden></div>

/* ───── engine ───── */
const ST={};GAMES.forEach(g=>ST[g.id]=fresh(g));
let cur=0,sel=null;
function fresh(g){return {placed:{},tried:{},first:0,order:shuffle(g.cards.map((_,i)=>i))};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=s=>document.querySelector(s);
const need=c=>c.need||1;
const total=g=>g.cards.reduce((t,c)=>t+need(c),0);
const doneCount=g=>Object.values(ST[g.id].placed).reduce((t,z)=>t+z.length,0);
const cardDone=(g,i)=>(ST[g.id].placed[i]||[]).length>=need(g.cards[i]);

function tabs(){
  $('#tabs').innerHTML=GAMES.map((g,i)=>`<button class="tab" role="tab" aria-selected="${i===cur}" data-tab="${i}" id="tab_${g.id}"><small>${g.kick}</small><span>${g.name}</span><em>${doneCount(g)} / ${total(g)}</em></button>`).join('');
}
function render(){
  const g=GAMES[cur],s=ST[g.id];sel=null;
  const cardHTML=i=>{const c=g.cards[i];const left=need(c)-(s.placed[i]||[]).length;
    const cls=['card',g.chips?'chip':'',(!c.img&&!g.chips)?'noimg':'',c.knit?'knit':''].join(' ');
    return `<button type="button" class="${cls}" data-i="${i}">${c.img?`<img src="${IMG[c.img]}" alt="${c.n}" draggable="false">`:''}${need(c)>1?`<span class="badge">${left<need(c)?'1 more role':'Plays 2 roles'}</span>`:''}<span class="txt"><span class="nm">${c.n}</span>${c.clue?`<span class="clue">${c.clue}</span>`:''}</span></button>`;};
  const remaining=s.order.filter(i=>!cardDone(g,i));
  $('#game').innerHTML=`<div class="gamehead"><div><h2>${g.name}<small>${g.sub}</small></h2><p>${g.intro}</p>
    ${g.heroImgs?`<div class="lede-img">${g.heroImgs.map(k=>`<img src="${IMG[k]}" alt="">`).join('')}</div>`:''}</div>
    <div class="stats"><span class="stat">Placed <b>${doneCount(g)}</b> / ${total(g)}</span><span class="stat">First-try <b>${s.first}</b></span><button class="btn ghost-btn" id="restart" type="button">Start again</button></div></div>
   <div class="game ${g.chips||g.layout==='stages'?'wide-cards':''}">
    <div class="tray" id="tray"><div class="tray-head"><span>${g.chips?'Tickets':'Cards'}</span></div>${remaining.map(cardHTML).join('')}${remaining.length?'':'<p class="done-msg">All placed. See your score below.</p>'}</div>
    <div><div class="board ${g.layout}" id="board">${g.zones.map(z=>zoneHTML(g,z)).join('')}</div><section class="finish" id="finish" hidden></section></div>
   </div>`;
  tabs();if(doneCount(g)===total(g))finish();
}
function zoneHTML(g,z){
  const s=ST[g.id];const items=[];
  g.cards.forEach((c,i)=>(s.placed[i]||[]).forEach(zid=>{if(zid===z.id)items.push(placedHTML(c,c.v[zid]));}));
  return `<div class="zone${items.length?' has':''}" data-z="${z.id}">${z.step?`<span class="step">${z.step}</span>`:''}${z.img?`<img class="zimg" src="${IMG[z.img]}" alt="${z.name}">`:''}<h3>${z.name}</h3>${z.def?`<p class="def">${z.def}</p>`:''}<div class="placedlist">${items.join('')}</div></div>`;
}
function placedHTML(c,why){return `<div class="placed">${c.img?`<img src="${IMG[c.img]}" alt="">`:''}<div><b>${c.n}</b><span>${why}</span></div></div>`;}

function attempt(i,zoneEl){
  const g=GAMES[cur],s=ST[g.id],c=g.cards[i],zid=zoneEl.dataset.z;
  const card=document.querySelector(`.card[data-i="${i}"]`);if(!card||cardDone(g,i))return;
  const already=s.placed[i]||[];
  if(c.v[zid]&&!already.includes(zid)){
    s.placed[i]=already.concat(zid);if(!s.tried[i+':'+already.length])s.first++;
    zoneEl.querySelector('.placedlist').insertAdjacentHTML('beforeend',placedHTML(c,c.v[zid]));zoneEl.classList.add('has');
    const old=zoneEl.querySelector('.stampmark');if(old)old.remove();zoneEl.insertAdjacentHTML('beforeend',`<span class="stampmark">${g.stamp}</span>`);
    toast(true,c.n+' · '+g.zones.find(z=>z.id===zid).name,c.v[zid]);
    if(cardDone(g,i)){card.remove();if(!document.querySelector('#tray .card'))$('#tray').insertAdjacentHTML('beforeend','<p class="done-msg">All placed. See your score below.</p>');}
    else{const b=card.querySelector('.badge');if(b)b.textContent='1 more role';}
  }else{
    s.tried[i+':'+already.length]=1;card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
    const msg=already.includes(zid)?'Already found that one. Where else do they fit?':(c.alt&&c.alt[zid])||'Not quite. Read the clue and the definitions again.';
    toast(false,'Try again',msg);
  }
  clearSel();
  const st=$('#game .stats');st.querySelectorAll('.stat b')[0].textContent=doneCount(g);st.querySelectorAll('.stat b')[1].textContent=s.first;tabs();
  if(doneCount(g)===total(g))finish();
}
function finish(){
  const g=GAMES[cur],s=ST[g.id],f=$('#finish');f.hidden=false;const next=GAMES[cur+1];
  f.innerHTML=`<h3>${g.name}: complete</h3><div class="big">${s.first} / ${total(g)}</div><p>placed correctly first time.</p>
   <p><b>Take it further:</b></p><ul>${g.more.map(m=>`<li>${m}</li>`).join('')}</ul>
   <div class="actions">${next?`<button class="btn" type="button" data-tab="${cur+1}">Next: ${next.kick}</button>`:''}<button class="btn ghost-btn" type="button" id="again">Play again</button></div>`;
}
let tt;function toast(good,h,t){const el=$('#toast');el.className='toast'+(good?'':' bad');el.innerHTML=`<b>${good?'✓ ':'✗ '}${h}</b>${t}`;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,good?4500:3800);}
function clearSel(){sel=null;document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));document.querySelectorAll('.zone.target').forEach(z=>z.classList.remove('target'));}
function select(i){clearSel();sel=i;document.querySelector(`.card[data-i="${i}"]`).classList.add('sel');document.querySelectorAll('.zone').forEach(z=>z.classList.add('target'));}

let drag=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||c.classList.contains('ghost'))return;drag={i:+c.dataset.i,el:c,x0:e.clientX,y0:e.clientY,ghost:null,over:null};});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.ghost){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;const r=drag.el.getBoundingClientRect();const g=drag.el.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');g.style.width=Math.min(r.width,260)+'px';document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');}
  e.preventDefault();drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(e.clientY-drag.ghost.offsetHeight/2)+'px';
  let t=null;for(const el of document.elementsFromPoint(e.clientX,e.clientY)){t=el.closest&&el.closest('.zone');if(t)break;}
  if(drag.over&&drag.over!==t)drag.over.classList.remove('over');if(t)t.classList.add('over');drag.over=t;
},{passive:false});
document.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.ghost){d.ghost.remove();d.el.classList.remove('dragging');if(d.over){d.over.classList.remove('over');attempt(d.i,d.over);}return;}
  sel===d.i?clearSel():select(d.i);
});
document.addEventListener('pointercancel',()=>{if(drag){drag.ghost&&drag.ghost.remove();drag.el.classList.remove('dragging');drag.over&&drag.over.classList.remove('over');drag=null;}});
document.addEventListener('click',e=>{
  if(e.target.closest('.card'))return;
  const tb=e.target.closest('[data-tab]');if(tb){cur=+tb.dataset.tab;render();window.scrollTo({top:0});try{location.hash=GAMES[cur].id}catch(_){}return;}
  if(e.target.closest('#restart,#again')){ST[GAMES[cur].id]=fresh(GAMES[cur]);render();return;}
  if(sel!==null){const z=e.target.closest('.zone');if(z)attempt(sel,z);}
});
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const i=+c.dataset.i;sel===i?clearSel():select(i);}});
document.getElementById('hard').addEventListener('change',e=>document.body.classList.toggle('hide-defs',e.target.checked));
const h=location.hash.slice(1);const hi=GAMES.findIndex(g=>g.id===h);if(hi>=0)cur=hi;
render();
</script>
